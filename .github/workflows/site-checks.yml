name: Site checks

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - sujaya-main

permissions:
  contents: read

jobs:
  static-checks:
    name: Static site checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run static checks
        run: npm run check:site

  browser-smoke:
    name: Browser smoke checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run browser checks
        run: npm run test:browser
