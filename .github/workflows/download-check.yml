name: Beta download check

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - public/apk.json
      - scripts/check-download.mjs
      - .github/workflows/download-check.yml

permissions:
  contents: read

jobs:
  check-download:
    name: Verify beta APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify APK availability, size, and expiry
        run: npm run check:download
